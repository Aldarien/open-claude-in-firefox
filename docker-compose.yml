# Hub: the primary MCP server, kept running with stdin open. No host ports are published.
# - Claude connects with `docker exec -i ocf-hub node /app/mcp-server.js` (runs as a client of this hub).
# - The browser extension connects over wss://ocf.localhost/ws through the global Traefik proxy
#   (HTTP router on `websecure`, TLS with Traefik's own certificate). It authenticates with an ES256 JWT
#   in the Sec-WebSocket-Protocol header, checked against data/jwks.json.
services:
  hub:
    build: ./host
    image: ocf-host
    container_name: ocf-hub
    command: ["node", "/app/mcp-server.js"]
    stdin_open: true
    restart: unless-stopped
    environment:
      OCF_BIND_HOST: "0.0.0.0"
      OCF_JWKS: /data/jwks.json
      OCF_CONFIG: /data/config.json
    volumes:
      - ./data:/data
    networks:
      - global-proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: global-proxy
      traefik.http.routers.ocf-hub.rule: "Host(`ocf.localhost`)"
      traefik.http.routers.ocf-hub.entrypoints: websecure
      traefik.http.routers.ocf-hub.tls: "true"
      traefik.http.services.ocf-hub.loadbalancer.server.port: "18766"

networks:
  global-proxy:
    external: true
